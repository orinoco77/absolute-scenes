name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write
  discussions: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Setup Windows Code Signing
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        # Decode base64 certificate and save to file
        $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_FILE }}")
        $certPath = "cert\windows-cert.p12"
        New-Item -ItemType Directory -Force -Path "cert"
        [IO.File]::WriteAllBytes($certPath, $certBytes)
        echo "Certificate saved to $certPath"

    - name: Setup macOS Code Signing
      if: matrix.os == 'macos-latest'
      run: |
        # Import certificate to keychain if provided
        if [ ! -z "${{ secrets.MACOS_CERT_FILE }}" ]; then
          echo "Setting up macOS code signing..."
          # You can add macOS certificate setup here if needed
          echo "macOS signing configured"
        else
          echo "No macOS certificate provided, building unsigned"
        fi

    - name: Install platform-specific dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Install dmg-license explicitly
        npm install dmg-license --save-dev || echo "dmg-license install failed, continuing..."
        # Install Python setuptools (sometimes needed)
        python3 -m pip install setuptools || echo "setuptools install failed, continuing..."

    - name: Run build
      run: npm run build

    - name: Run dist (Windows with signing)
      if: matrix.os == 'windows-latest'
      shell: powershell
      run: |
        # Debug certificate info
        Write-Host "Certificate file exists: $(Test-Path 'cert\windows-cert.p12')"
        Write-Host "Certificate file size: $((Get-Item 'cert\windows-cert.p12').Length) bytes"
        Write-Host "Password length: $('${{ secrets.WINDOWS_CERT_PASSWORD }}'.Length) characters"
        
        # Set environment variables and run build
        $env:CSC_LINK = "cert\windows-cert.p12"
        $env:CSC_KEY_PASSWORD = "${{ secrets.WINDOWS_CERT_PASSWORD }}"
        $env:GH_TOKEN = "${{ secrets.GITHUB_TOKEN }}"
        $env:ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES = "true"
        $env:CI = "false"
        
        # Verify environment variables are set
        Write-Host "CSC_LINK set to: $env:CSC_LINK"
        Write-Host "CSC_KEY_PASSWORD is set: $($env:CSC_KEY_PASSWORD -ne $null)"
        
        npm run dist
        
    - name: Run dist (macOS/Linux)
      if: matrix.os != 'windows-latest'
      run: npm run dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        CI: false
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

    - name: List build outputs
      shell: bash
      run: |
        echo "Build outputs in dist/:"
        ls -la dist/ || echo "No dist directory"
        echo "Looking for installer files:"
        find dist/ -name "*.dmg" -o -name "*.zip" -o -name "*Setup*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" -o -name "*.snap" 2>/dev/null || echo "No installer files found"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.platform }}
        path: |
          dist/*.dmg
          dist/*.zip
          dist/*Setup*.exe
          dist/*.msi
          dist/*.deb
          dist/*.rpm
          dist/*.AppImage
          dist/*.tar.gz
          dist/*.snap
        retention-days: 5

    - name: Cleanup certificates
      if: always()
      shell: bash
      run: |
        # Remove certificate files for security
        rm -rf cert/ 2>/dev/null || echo "No cert directory to clean"
        echo "Certificate files cleaned up"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Display structure of downloaded files
      run: ls -la ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts/release-linux/*.AppImage
          ./artifacts/release-linux/*.deb
          ./artifacts/release-linux/*.rpm
          ./artifacts/release-linux/*.tar.gz
          ./artifacts/release-linux/*.snap
          ./artifacts/release-windows/*.exe
          ./artifacts/release-windows/*.msi
          ./artifacts/release-mac/*.dmg
          ./artifacts/release-mac/*.zip
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags like v1.0.0
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write
  discussions: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install platform-specific dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Install dmg-license explicitly
        npm install dmg-license --save-dev || echo "dmg-license install failed, continuing..."
        # Install Python setuptools (sometimes needed)
        python3 -m pip install setuptools || echo "setuptools install failed, continuing..."

    - name: Run build
      run: npm run build

    - name: Run dist
      run: npm run dist
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        # Disable auto-publishing to avoid conflicts
        CI: false

    - name: List build outputs
      run: |
        echo "Build outputs in dist/:"
        ls -la dist/ || echo "No dist directory"
        echo "Looking for installer files:"
        find dist/ -name "*.dmg" -o -name "*.zip" -o -name "*Setup*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" -o -name "*.snap" 2>/dev/null || echo "No installer files found"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.platform }}
        path: |
          dist/*.dmg
          dist/*.zip
          dist/*Setup*.exe
          dist/*.msi
          dist/*.deb
          dist/*.rpm
          dist/*.AppImage
          dist/*.tar.gz
          dist/*.snap
        retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Display structure of downloaded files
      run: ls -la ./artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts/release-linux/*.AppImage
          ./artifacts/release-linux/*.deb
          ./artifacts/release-linux/*.rpm
          ./artifacts/release-linux/*.tar.gz
          ./artifacts/release-linux/*.snap
          ./artifacts/release-windows/*.exe
          ./artifacts/release-windows/*.msi
          ./artifacts/release-mac/*.dmg
          ./artifacts/release-mac/*.zip
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

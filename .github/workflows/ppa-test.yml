name: Test PPA Publishing

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (e.g., 1.4.4)'
        required: true
        type: string
      publish:
        description: 'Actually publish to PPA (false for testing)'
        required: true
        type: boolean
        default: false

jobs:
  ppa-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up GPG key for PPA signing
      env:
        LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        if [ -n "$LINUX_GPG_PRIVATE_KEY" ]; then
          echo "Setting up GPG for PPA signing..."

          # Start gpg-agent
          gpg-agent --daemon || echo "gpg-agent already running"

          # Import GPG private key
          echo "$LINUX_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import

          # Configure GPG for non-interactive use
          export GPG_TTY=""
          export GNUPGHOME="$HOME/.gnupg"

          # Install PPA tools and build dependencies
          sudo apt-get update
          sudo apt-get install -y devscripts build-essential dput debhelper

          # Check available debhelper version
          echo "Available debhelper version:"
          apt-cache policy debhelper

          echo "✅ GPG and PPA tools configured"
        else
          echo "❌ No GPG key configured for PPA signing"
          exit 1
        fi

    - name: Create binary package for PPA
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        VERSION="${{ github.event.inputs.version }}"
        BUILD_DIR="/tmp/ppa-build"
        mkdir -p "$BUILD_DIR"
        cd "$BUILD_DIR"

        APPIMAGE_URL="https://github.com/orinoco77/absolute-scenes/releases/download/v${VERSION}/Absolute.Scenes-${VERSION}.AppImage"
        echo "Attempting to download: $APPIMAGE_URL"
        if ! wget "$APPIMAGE_URL" -O "absolute-scenes-${VERSION}.AppImage"; then
          echo "❌ Failed to download AppImage for version ${VERSION}"
          echo "Available releases:"
          curl -s https://api.github.com/repos/orinoco77/absolute-scenes/releases | grep -E '"tag_name"|"name".*\.AppImage' | head -20
          exit 1
        fi

        PKG_DIR="absolute-scenes-${VERSION}"
        mkdir -p "$PKG_DIR"
        cp -r "$GITHUB_WORKSPACE/linux-packaging/ppa/debian" "$PKG_DIR/"

        cd "$PKG_DIR"
        CURRENT_DATE=$(date -R)
        {
          echo "absolute-scenes (${VERSION}-1) jammy; urgency=medium"
          echo ""
          echo "  * Release version ${VERSION}"
          echo "  * Binary package from GitHub releases"
          echo ""
          echo " -- Adam Short <ajs@shiny.org.uk>  ${CURRENT_DATE}"
        } > debian/changelog

        mkdir -p usr/lib/absolute-scenes usr/bin usr/share/applications usr/share/pixmaps

        cp "../absolute-scenes-${VERSION}.AppImage" usr/lib/absolute-scenes/absolute-scenes
        chmod +x usr/lib/absolute-scenes/absolute-scenes

        echo '#!/bin/bash' > usr/bin/absolute-scenes
        echo 'exec /usr/lib/absolute-scenes/absolute-scenes "$@"' >> usr/bin/absolute-scenes
        chmod +x usr/bin/absolute-scenes

        cp debian/absolute-scenes.desktop usr/share/applications/
        cp "$GITHUB_WORKSPACE/assets/icon.png" usr/share/pixmaps/absolute-scenes.png

        echo "✅ Binary package structure ready"

        # Create original source tarball (required for Debian source packages)
        cd "$BUILD_DIR"
        tar -czf "absolute-scenes_${VERSION}.orig.tar.gz" \
          --exclude="debian" \
          --transform="s,^$PKG_DIR,absolute-scenes-${VERSION}," \
          "$PKG_DIR"

        # Build the source package for PPA
        cd "$PKG_DIR"
        debuild -S -sa

    - name: Upload to PPA
      if: github.event.inputs.publish == 'true'
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        VERSION="${{ github.event.inputs.version }}"
        BUILD_DIR="/tmp/ppa-build"
        cd "$BUILD_DIR"

        # Find the changes file (should be created by debuild)
        CHANGES_FILE=$(ls absolute-scenes_${VERSION}-1_source.changes 2>/dev/null | head -1)

        if [ -n "$CHANGES_FILE" ] && [ -f "$CHANGES_FILE" ]; then
          echo "Uploading $CHANGES_FILE to PPA: ppa:b-ajs/absolute-scenes"

          # Upload to PPA
          dput ppa:b-ajs/absolute-scenes "$CHANGES_FILE"

          echo "✅ Successfully uploaded to PPA"
          echo "Package will be available at: https://launchpad.net/~b-ajs/+archive/ubuntu/absolute-scenes"
        else
          echo "❌ No changes file found for upload"
          ls -la
          exit 1
        fi

    - name: Test Results
      if: github.event.inputs.publish == 'false'
      run: |
        echo "🧪 PPA Test Mode - No files were uploaded"
        echo "✅ Source package built successfully"
        echo "To actually publish, re-run with publish=true"
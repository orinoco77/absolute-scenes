name: Build and Release

on:
  push:
    tags:
      - 'v*' # v1.0.0, v2.3.4, etc.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      run: npm ci

    # ---------- WINDOWS CERTIFICATE SETUP ----------
    - name: Setup Windows Code Signing
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        if ("${{ secrets.WINDOWS_CERT_FILE }}" -ne "") {
          # Decode base64 certificate and save to file
          $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_FILE }}")
          New-Item -ItemType Directory -Force -Path "cert" | Out-Null
          [IO.File]::WriteAllBytes("cert/windows-cert.p12", $certBytes)
          Write-Host "✅ Windows certificate saved"

          # Patch package.json for Electron Builder
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if (-not $pkg.build.win) { $pkg.build | Add-Member -MemberType NoteProperty -Name win -Value @{} }
          if (-not $pkg.build.win.signtoolOptions) { $pkg.build.win | Add-Member -MemberType NoteProperty -Name signtoolOptions -Value @{} }
          $pkg.build.win.signtoolOptions.certificateFile = "cert/windows-cert.p12"
          $pkg.build.win.signtoolOptions.certificatePassword = "${{ secrets.WINDOWS_CERT_PASSWORD }}"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json -Encoding UTF8
          Write-Host "✅ package.json updated for Windows signing"
        } else {
          Write-Host "ℹ️ No Windows certificate provided. Building unsigned."

          # package.json hardcodes a default build.win.signtoolOptions
          # pointing at cert/windows-cert.p12 -- that file is never written
          # in this branch, so electron-builder must not be left pointing
          # at it. Without this, it still attempts to sign against a
          # nonexistent cert file and fails outright (confirmed live:
          # SignTool Error: Store IsDiskFile() failed).
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.build.win -and $pkg.build.win.PSObject.Properties['signtoolOptions']) {
            $pkg.build.win.PSObject.Properties.Remove('signtoolOptions')
            $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json -Encoding UTF8
            Write-Host "✅ Removed signtoolOptions from package.json -- building unsigned"
          }
        }

    # ---------- MACOS CERTIFICATE SETUP (Option 1) ----------
    - name: Setup macOS Code Signing
      if: matrix.platform == 'mac'
      run: |
        if [ -n "${{ secrets.MACOS_CERT_FILE }}" ]; then
          echo "Setting up macOS signing..."
          echo "${{ secrets.MACOS_CERT_FILE }}" | base64 --decode > macos-cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import macos-cert.p12 -k build.keychain -P "${{ secrets.MACOS_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          echo "✅ macOS certificate imported"
        else
          echo "ℹ️ No macOS certificate provided. Building unsigned."
        fi

    # ---------- LINUX GPG SETUP ----------
    - name: Setup Linux Package Signing
      if: matrix.platform == 'linux'
      run: |
        if [ -n "${{ secrets.LINUX_GPG_PRIVATE_KEY }}" ]; then
          echo "Setting up Linux package signing..."
          
          # Configure GPG for non-interactive use
          export GPG_TTY=""
          export GNUPGHOME="$HOME/.gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          
          # Configure GPG to not use a TTY
          echo "use-agent" >> "$GNUPGHOME/gpg.conf"
          echo "pinentry-mode loopback" >> "$GNUPGHOME/gpg.conf"
          echo "batch" >> "$GNUPGHOME/gpg.conf"
          echo "no-tty" >> "$GNUPGHOME/gpg.conf"
          
          # Configure gpg-agent for automated signing
          echo "allow-loopback-pinentry" >> "$GNUPGHOME/gpg-agent.conf"
          echo "max-cache-ttl 86400" >> "$GNUPGHOME/gpg-agent.conf"
          echo "default-cache-ttl 86400" >> "$GNUPGHOME/gpg-agent.conf"
          
          # Start gpg-agent
          gpg-agent --daemon || echo "gpg-agent already running"
          
          # Import GPG private key
          echo "${{ secrets.LINUX_GPG_PRIVATE_KEY }}" | base64 --decode | gpg --batch --import
          
          # Pre-authenticate with passphrase if provided
          if [ -n "${{ secrets.GPG_PASSPHRASE }}" ]; then
            echo "Pre-authenticating GPG key..."
            echo "test" | gpg --batch --yes --passphrase "${{ secrets.GPG_PASSPHRASE }}" --pinentry-mode loopback --sign --armor | head -1 || echo "Pre-auth failed, continuing anyway"
          fi
          
          # Install signing tools
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts rpm
          
          # Install debsigs (alternative to dpkg-sig)
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/d/debsigs/debsigs_0.1.18_all.deb
          sudo dpkg -i debsigs_0.1.18_all.deb || sudo apt-get install -f -y
          
          echo "✅ Linux signing tools installed"
        else
          echo "ℹ️ No Linux GPG key provided. Building unsigned packages."
        fi

    # ---------- PLATFORM-SPECIFIC DEPENDENCIES ----------
    - name: Install macOS-specific dependencies
      if: matrix.platform == 'mac'
      run: |
        npm install dmg-license --save-dev || echo "Skipping dmg-license"
        python3 -m pip install setuptools || echo "Skipping setuptools"

    # ---------- BUILD ----------
    - name: Run build
      run: npm run build

    - name: Package app (dist)
      run: npm run build && npx electron-builder --publish never
      env:
        ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

    # ---------- LINUX PACKAGE SIGNING ----------
    - name: Sign Linux packages
      if: matrix.platform == 'linux' && env.LINUX_GPG_PRIVATE_KEY
      env:
        LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        if [ -n "$LINUX_GPG_PRIVATE_KEY" ]; then
          echo "Signing Linux packages..."
          
          # Configure GPG environment for this step
          export GPG_TTY=""
          export GNUPGHOME="$HOME/.gnupg"
          
          # Get GPG key ID (first key in keyring)
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec:' | cut -d: -f5 | head -1)
          echo "Using GPG key: $GPG_KEY_ID"
          
          # Sign DEB packages
          if command -v debsigs >/dev/null 2>&1; then
            for deb in dist/*.deb; do
              if [ -f "$deb" ]; then
                echo "Signing $deb..."
                if [ -n "$GPG_PASSPHRASE" ]; then
                  echo "$GPG_PASSPHRASE" | debsigs --sign=origin -k "$GPG_KEY_ID" "$deb" || echo "⚠️ Failed to sign $(basename $deb)"
                else
                  debsigs --sign=origin -k "$GPG_KEY_ID" "$deb" || echo "⚠️ Failed to sign $(basename $deb)"
                fi
                echo "✅ Processed $(basename $deb)"
              fi
            done
          else
            echo "⚠️ debsigs not available, skipping DEB signing"
          fi
          
          # Sign RPM packages
          if command -v rpm >/dev/null 2>&1; then
            for rpm in dist/*.rpm; do
              if [ -f "$rpm" ]; then
                echo "Signing $rpm..."
                # Create temporary rpmmacros for signing
                echo "%_gpg_name $GPG_KEY_ID" > ~/.rpmmacros
                echo "%_signature gpg" >> ~/.rpmmacros
                if [ -n "$GPG_PASSPHRASE" ]; then
                  echo "%__gpg_sign_cmd %{__gpg} gpg --force-v3-sigs --batch --verbose --no-armor --no-secmem-warning --pinentry-mode loopback --passphrase \"$GPG_PASSPHRASE\" -u \"%{_gpg_name}\" -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}" >> ~/.rpmmacros
                else
                  echo "%__gpg_sign_cmd %{__gpg} gpg --force-v3-sigs --batch --verbose --no-armor --no-secmem-warning -u \"%{_gpg_name}\" -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}" >> ~/.rpmmacros
                fi
                rpm --addsign "$rpm" || echo "⚠️ Failed to sign $(basename $rpm)"
                echo "✅ Processed $(basename $rpm)"
              fi
            done
          else
            echo "⚠️ rpm not available, skipping RPM signing"
          fi
          
          echo "✅ Linux package signing completed"
        fi

    # ---------- UPLOAD ARTIFACTS ----------
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.platform }}
        path: |
          dist/*.dmg
          dist/*.zip
          dist/*Setup*.exe
          dist/*.msi
          dist/*.deb
          dist/*.rpm
          dist/*.AppImage
          dist/*.tar.gz
          dist/*.snap
        retention-days: 5

    # ---------- CLEANUP CERTS ----------
    - name: Cleanup certificates
      if: always()
      shell: bash
      run: rm -rf cert macos-cert.p12 || true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    # Download each platform's artifacts
    - name: Download Linux artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-linux
        path: ./artifacts/linux

    - name: Download macOS artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-mac
        path: ./artifacts/mac

    - name: Download Windows artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-windows
        path: ./artifacts/windows

    - name: Show downloaded files
      run: find ./artifacts -type f -name "*" | sort

    - name: Collect all release files
      run: |
        mkdir -p ./release-files
        find ./artifacts -type f \( \
          -name "*.dmg" -o \
          -name "*.zip" -o \
          -name "*Setup*.exe" -o \
          -name "*.msi" -o \
          -name "*.deb" -o \
          -name "*.rpm" -o \
          -name "*.AppImage" -o \
          -name "*.tar.gz" -o \
          -name "*.snap" \
        \) -exec cp {} ./release-files/ \;
        echo "Files to release:"
        ls -la ./release-files/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./release-files/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ppa-publish:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up GPG key for PPA signing
      env:
        LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        if [ -n "$LINUX_GPG_PRIVATE_KEY" ]; then
          echo "Setting up GPG for PPA signing..."

          # Start gpg-agent
          gpg-agent --daemon || echo "gpg-agent already running"

          # Import GPG private key
          echo "$LINUX_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import

          # Install PPA tools
          sudo apt-get update
          sudo apt-get install -y devscripts build-essential dput

          echo "✅ GPG and PPA tools configured"
        else
          echo "❌ No GPG key configured for PPA signing"
          exit 1
        fi

    - name: Get version from tag
      id: get-version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Create source package for PPA
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        VERSION="${{ steps.get-version.outputs.version }}"
        echo "Building PPA source package for version $VERSION"

        # Create build directory
        BUILD_DIR="/tmp/ppa-build"
        mkdir -p "$BUILD_DIR"
        cd "$BUILD_DIR"

        # Create original source tarball
        tar --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='build' \
            -czf "absolute-scenes_${VERSION}.orig.tar.gz" \
            -C "$(dirname "$GITHUB_WORKSPACE")" "$(basename "$GITHUB_WORKSPACE")"

        # Extract source
        tar -xzf "absolute-scenes_${VERSION}.orig.tar.gz"
        mv "$(basename "$GITHUB_WORKSPACE")" "absolute-scenes-${VERSION}"

        # Copy Debian packaging files
        cp -r "$GITHUB_WORKSPACE/linux-packaging/ppa/debian" "absolute-scenes-${VERSION}/"

        # Generate changelog with current version and date
        cd "absolute-scenes-${VERSION}"
        CURRENT_DATE=$(date -R)
        {
          echo "absolute-scenes (${VERSION}-1) jammy; urgency=medium"
          echo ""
          echo "  * Release version ${VERSION}"
          echo "  * Professional scene-based book writing application"
          echo "  * Enhanced export capabilities (PDF, HTML, EPUB)"
          echo "  * Improved GitHub integration for cloud backup and version control"
          echo "  * Character and location management tools"
          echo "  * Scene-based writing organization with drag-and-drop"
          echo "  * Premium typography options with genre-based font recommendations"
          echo ""
          echo " -- Adam Short <ajs@shiny.org.uk>  ${CURRENT_DATE}"
        } > debian/changelog

        echo "Generated changelog for version ${VERSION}"

        # Build source package with signing
        if [ -n "$GPG_PASSPHRASE" ]; then
          # Get GPG key ID
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep '^sec:' | cut -d: -f5 | head -1)
          echo "Using GPG key: $GPG_KEY_ID"

          # Build signed source package
          echo "$GPG_PASSPHRASE" | debuild -S -k"$GPG_KEY_ID" --lintian-opts --no-lintian
        else
          debuild -S --no-lintian
        fi

        # Show generated files
        cd "$BUILD_DIR"
        echo "Generated PPA files:"
        ls -la *.dsc *.changes *.tar.* 2>/dev/null || echo "No PPA files generated"

    - name: Upload to PPA
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        VERSION="${{ steps.get-version.outputs.version }}"
        BUILD_DIR="/tmp/ppa-build"
        cd "$BUILD_DIR"

        # Find the changes file
        CHANGES_FILE=$(ls absolute-scenes_${VERSION}-1_source.changes 2>/dev/null | head -1)

        if [ -n "$CHANGES_FILE" ] && [ -f "$CHANGES_FILE" ]; then
          echo "Uploading $CHANGES_FILE to PPA: ppa:b-ajs/absolute-scenes"

          # Upload to PPA
          dput ppa:b-ajs/absolute-scenes "$CHANGES_FILE"

          echo "✅ Successfully uploaded to PPA"
          echo "Package will be available at: https://launchpad.net/~b-ajs/+archive/ubuntu/absolute-scenes"
        else
          echo "❌ No changes file found for upload"
          ls -la
          exit 1
        fi